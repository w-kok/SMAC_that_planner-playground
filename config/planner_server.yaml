# # # #       minimum_turning_radius: 2.0 #12.0 #5.0 #2.5 # minimum turning radius in m of path / vehicle
# # # #       reverse_penalty: 1.0 #2.0 # Penalty to apply if motion is reversing, must be => 1
# # # #       change_penalty: 0.5 #0.0 # Penalty to apply if motion is changing directions (L to R), must be >= 0
# # # #       non_straight_penalty: 1.0 #1.2 # Penalty to apply if motion is non-straight, must be => 1
# # # #       cost_penalty: 2.0 # Penalty to apply to higher cost areas when adding into the obstacle map dynamic programming distance expansion heuristic. This drives the robot more towards the center of passages. A value between 1.3 - 3.5 is reasonable.
